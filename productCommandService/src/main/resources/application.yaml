server:
  port: 9000

spring:
  application:
    name: productCommandService
  security:
    jwt:
      secret: ${JWT_SECRET}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_service}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update